<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Chess — HTML / CSS / JavaScript</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <div class="container">
    <header>
      <h1>Chess (HTML · CSS · JavaScript)</h1>
      <div class="controls">
        <button id="undoBtn">Undo</button>
        <button id="resetBtn">Reset</button>

        <label style="display:flex;align-items:center;gap:6px">
          <select id="modeSelect" title="Game mode">
            <option value="pvp">Two Players</option>
            <option value="ai">Play vs AI</option>
          </select>
        </label>

        <label style="display:flex;align-items:center;gap:6px">
          AI Side:
          <select id="aiSideSelect" title="AI side">
            <option value="b">Black (AI)</option>
            <option value="w">White (AI)</option>
          </select>
        </label>

        <label style="display:flex;align-items:center;gap:6px">
          Difficulty:
          <select id="aiLevelSelect" title="AI difficulty">
            <option value="easy">Easy</option>
            <option value="medium" selected>Medium</option>
            <option value="hard">Hard</option>
          </select>
        </label>

        <div id="status" class="status">White to move</div>
      </div>
    </header>

    <main>
      <div class="board-wrap">
        <div id="board" class="board" aria-label="Chess board"></div>
      </div>

      <aside class="sidebar">
        <h2>Moves</h2>
        <ol id="moveList" class="moves"></ol>
      </aside>
    </main>

    <footer>
      <small>Click a piece to see legal moves. Click a target square to move. Pawn promotion prompts for piece (Q/R/B/N).</small>
    </footer>
  </div>

  <script src="script.js"></script>
</body>
</html>
