<!doctype html>
<html lang="uz">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Lucky Roulette</title>

  <link rel="stylesheet" href="./css/game.css">
</head>

<body>

<header class="navbar">
  <b>Lucky Roulette</b>

  <div>
    <a href="./dashboard.html">Kabinet</a>
    <button id="logoutBtn">Chiqish</button>
  </div>
</header>

<main class="game-page">

  <h1>Lucky Roulette</h1>

  <p class="description">
    3 ishtirokchi. 3 ta stavka. 1 ta g‘olib.
  </p>

  <!-- ISHTIROKCHILAR -->
  <section class="players" id="players">

    <div class="player-card">
      <div class="player-number">1</div>
      <div class="player-name">Kutilmoqda...</div>
      <div class="player-bet">—</div>
      <div class="player-status">Bo‘sh</div>
    </div>

    <div class="player-card">
      <div class="player-number">2</div>
      <div class="player-name">Kutilmoqda...</div>
      <div class="player-bet">—</div>
      <div class="player-status">Bo‘sh</div>
    </div>

    <div class="player-card">
      <div class="player-number">3</div>
      <div class="player-name">Kutilmoqda...</div>
      <div class="player-bet">—</div>
      <div class="player-status">Bo‘sh</div>
    </div>

  </section>

  <!-- BANK -->
  <section class="pot-box">
    <span>Jami bank</span>
    <strong id="pot">0 UZS</strong>
  </section>

  <!-- O'YINGA QO'SHILISH -->
  <section id="joinPanel" class="control-panel">

    <h2>O‘yinga qo‘shilish</h2>

    <label for="betInput">
      Stavka miqdori
    </label>

    <input
      id="betInput"
      type="number"
      min="1000"
      step="1000"
      value="10000"
    >

    <button id="joinBtn">
      Stavkani tasdiqlash
    </button>

  </section>

  <!-- TAYYOR -->
  <section id="readyPanel" class="control-panel hidden">

    <h2>Stavkangiz qabul qilindi</h2>

    <p id="myBet"></p>

    <button id="readyBtn">
      ✓ TAYYOR
    </button>

  </section>

  <!-- SPINNER -->
  <section class="roulette-area">

    <div class="pointer">
      ▼
    </div>

    <div id="wheel" class="wheel">

      <div class="sector sector-one">
        <span id="name1">Kutilmoqda</span>
      </div>

      <div class="sector sector-two">
        <span id="name2">Kutilmoqda</span>
      </div>

      <div class="sector sector-three">
        <span id="name3">Kutilmoqda</span>
      </div>

      <div class="wheel-center">
        LR
      </div>

    </div>

  </section>

  <!-- STATUS -->
  <div id="status" class="status">
    3 ta ishtirokchi kutilmoqda.
  </div>

  <div id="countdown" class="countdown"></div>

  <div id="result" class="result"></div>

</main>

<script type="module" src="./js/game.js?v=3"></script>

</body>
</html>
