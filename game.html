<!DOCTYPE html>
<html lang="uz">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Lucky Roulette</title>

    <link rel="stylesheet" href="./css/game.css">
</head>

<body>

<header class="navbar">

    <div class="logo">
        Lucky Roulette
    </div>

    <div class="nav-right">
        <a href="./dashboard.html">Kabinet</a>
        <button id="logoutBtn">Chiqish</button>
    </div>

</header>


<main class="game-page">

    <h1>Lucky Roulette</h1>

    <p class="subtitle">
        3 ishtirokchi • 1 g‘olib
    </p>


    <!-- ISHTIROKCHILAR -->

    <section class="players">

        <div class="player-card" id="playerCard1">

            <div class="player-number">
                1
            </div>

            <div
                class="player-name"
                id="player1Name"
            >
                Kutilmoqda...
            </div>

            <div
                class="player-bet"
                id="player1Bet"
            >
                —
            </div>

            <div
                class="player-ready"
                id="player1Ready"
            >
                Kutilmoqda
            </div>

        </div>


        <div class="player-card" id="playerCard2">

            <div class="player-number">
                2
            </div>

            <div
                class="player-name"
                id="player2Name"
            >
                Kutilmoqda...
            </div>

            <div
                class="player-bet"
                id="player2Bet"
            >
                —
            </div>

            <div
                class="player-ready"
                id="player2Ready"
            >
                Kutilmoqda
            </div>

        </div>


        <div class="player-card" id="playerCard3">

            <div class="player-number">
                3
            </div>

            <div
                class="player-name"
                id="player3Name"
            >
                Kutilmoqda...
            </div>

            <div
                class="player-bet"
                id="player3Bet"
            >
                —
            </div>

            <div
                class="player-ready"
                id="player3Ready"
            >
                Kutilmoqda
            </div>

        </div>

    </section>


    <!-- BANK -->

    <div class="pot-box">

        <span>Jami bank</span>

        <strong id="totalPot">
            0 UZS
        </strong>

    </div>


    <!-- O'YINGA QO'SHILISH -->

    <section
        id="joinPanel"
        class="control-panel"
    >

        <h2>O‘yinga qo‘shilish</h2>

        <label for="betInput">
            Stavka
        </label>

        <input
            id="betInput"
            type="number"
            min="1000"
            step="1000"
            value="10000"
        >

        <button id="joinBtn">
            Stavkani tasdiqlash
        </button>

    </section>


    <!-- TAYYOR -->

    <section
        id="readyPanel"
        class="control-panel hidden"
    >

        <h2>Stavka qabul qilindi</h2>

        <p id="myBet">
            —
        </p>

        <button id="readyBtn">
            ✓ TAYYOR
        </button>

    </section>


    <!-- BARABAN -->

    <section class="wheel-area">

        <div class="arrow">
            ▼
        </div>

        <div
            id="wheel"
            class="wheel"
        >

            <!-- LOGINLAR -->

            <div class="sector-label label-1">
                <span id="wheelName1">
                    Kutilmoqda
                </span>
            </div>

            <div class="sector-label label-2">
                <span id="wheelName2">
                    Kutilmoqda
                </span>
            </div>

            <div class="sector-label label-3">
                <span id="wheelName3">
                    Kutilmoqda
                </span>
            </div>


            <!-- 2 TA CHEGARA -->

            <div class="divider divider-1"></div>

            <div class="divider divider-2"></div>


            <!-- MARKAZ -->

            <div class="wheel-center">
                LR
            </div>

        </div>

    </section>


    <!-- STATUS -->

    <div
        id="gameStatus"
        class="game-status"
    >
        3 ta ishtirokchi kutilmoqda.
    </div>


    <!-- COUNTDOWN -->

    <div
        id="countdown"
        class="countdown"
    ></div>


    <!-- RESULT -->

    <div
        id="result"
        class="result"
    ></div>

</main>


<script
    type="module"
    src="./js/game.js?v=4"
></script>

</body>
</html>
